services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  worker:
    image: python:3.14-slim
    working_dir: /app/apps/api
    command: >
      sh -c "pip install uv &&
      uv sync &&
      uv run arq app.workers.resume_worker.WorkerSettings"
    env_file:
      - apps/api/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      UV_PROJECT_ENVIRONMENT: /tmp/hireflow-api-venv
      UV_LINK_MODE: copy
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
